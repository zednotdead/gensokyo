---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lidarr-secret
    creationPolicy: Owner
    template:
      data:
        INIT_POSTGRES_DBNAME: lidarr_main lidarr_log
        INIT_POSTGRES_HOST: &dbHost postgres-lb.database.svc
        INIT_POSTGRES_USER: &dbUser "{{ .DATABASE_USER }}"
        INIT_POSTGRES_PASS: &dbPass "{{ .DATABASE_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .CNPG_password }}"

        LIDARR__AUTH__APIKEY: "{{ .API_KEY }}"
        LIDARR__POSTGRES__MAINDB: lidarr_main
        LIDARR__POSTGRES__LOGDB: lidarr_log
        LIDARR__POSTGRES__HOST: *dbHost
        LIDARR__POSTGRES__USER: *dbUser
        LIDARR__POSTGRES__PASSWORD: *dbPass
        LIDARR__POSTGRES__PORT: "5432"
  dataFrom:
    - extract:
        key: Lidarr
    - extract:
        key: cloudnative-pg
      rewrite:
        - regexp:
            source: "(.*)"
            target: "CNPG_$1"
