events {
  multi_accept       on;
  worker_connections 65535;
}

http {
  charset                utf-8;
  sendfile               on;
  tcp_nopush             on;
  tcp_nodelay            on;
  server_tokens          off;
  log_not_found          off;
  types_hash_max_size    2048;
  types_hash_bucket_size 64;
  client_max_body_size   16M;

  # MIME
  include                mime.types;
  default_type           application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent $http_host $uri $is_args';

  access_log /dev/stdout;

  # Logging
  error_log   /var/log/nginx/error.log warn;

  # Set the DNS resolver to the Kubernetes DNS service
  resolver kube-dns.kube-system.svc.cluster.local valid=30s;

  proxy_cache_path /var/cache/nginx keys_zone=websitecache:10m;

  upstream s3_backend {
    server rustfs.default.svc:9000;
  }

  server {
    listen	80;
    listen	[::]:80;
    server_name zed.gay;

    proxy_buffering off;

    proxy_intercept_errors on;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-minio-deployment-id;

    location / {
      rewrite (.*)/$ $1/index.html;
      rewrite ^([^.]*[^/])$ $1/ last;

      proxy_pass http://s3_backend/static/;
    }
  }
}
