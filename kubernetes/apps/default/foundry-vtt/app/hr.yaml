---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry-vtt
spec:
  chartRef:
    kind: OCIRepository
    name: foundry
  interval: 1h
  values:
    controllers:
      foundry:
        forceRename: foundry
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              CONTAINER_PRESERVE_CONFIG: "true"
              FOUNDRY_HOSTNAME: &hostname vtt.${SECRET_DOMAIN}
              FOUNDRY_PROXY_SSL: "true"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: foundry
            image:
              repository: ghcr.io/felddy/foundryvtt
              tag: 14.369.0@sha256:76497e09a7eeae769359eebdaae3bbcf39c9c826068f7dcc061b8b7e9bffaec8
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 1434Mi
              limits:
                memory: 5Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: foundry
        forceRename: foundry
        primary: true
        ports:
          http:
            port: &port 30000
      proxy:
        controller: proxy
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - *hostname
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: foundry-vtt
