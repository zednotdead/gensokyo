---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry
spec:
  chartRef:
    kind: OCIRepository
    name: foundry
  interval: 1h
  values:
    controllers:
      foundry:
        forceRename: foundry
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              CONTAINER_PRESERVE_CONFIG: "true"
              FOUNDRY_HOSTNAME: &hostname vtt.${SECRET_DOMAIN}
              FOUNDRY_PROXY_SSL: "true"
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: foundry
            image:
              repository: ghcr.io/felddy/foundryvtt
              tag: 14.368.0@sha256:8ec86078b0c461644d896cbe3a9f9bcae7d1ce8dc8d91eeb0b0f1d94c91c072f
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 1434Mi
              limits:
                memory: 5Gi
      proxy:
        containers:
          app:
            image:
              repository: ghcr.io/mrprimate/ddb-proxy
              tag: 7.0.26@sha256:edf3c3647a7db219019ff532f661460b7c4c67b686c9f18d28b62bbcf98f9845
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: foundry
        forceRename: foundry
        primary: true
        ports:
          http:
            port: &port 30000
      proxy:
        controller: proxy
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - *hostname
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      proxy:
        hostnames:
          - vtt-proxy.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: proxy
                port: 3000
    persistence:
      data:
        existingClaim: foundry
