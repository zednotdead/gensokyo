---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app syncthing
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      syncthing:
        containers:
          app:
            image:
              repository: ghcr.io/syncthing/syncthing
              tag: 2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SYNCTHING_ADDRESS}
        primary: true
        ports:
          http:
            port: 8384
            targetPort: &port 8384
          sync:
            protocol: TCP
            port: &sync 22000
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      sync:
        kind: TCPRoute
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: syncthing
        rules:
          - backendRefs:
              - name: syncthing
                port: *sync
    persistence:
      config:
        existingClaim: syncthing
      data:
        enabled: true
        type: nfs
        server: ${NAS_ADDRESS}
        path: "${NAS_BASE_URL}/media/software/syncthing"
        globalMounts:
          - path: /var/syncthing
