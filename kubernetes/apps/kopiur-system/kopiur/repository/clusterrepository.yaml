---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: storage
spec:
  create:
    enabled: false
  allowedNamespaces:
    all: true
  credentialProjection:
    allowed: true
  maintenance:
    enabled: true
    takeoverPolicy: Force
    schedule:
      full:
        cron: 0 3 * * *
        jitter: 1h
      quick:
        cron: 0 0/2 * * *
        jitter: 30m
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 1200
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: rustfs.default.svc:9000
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: ${TIMEZONE}
